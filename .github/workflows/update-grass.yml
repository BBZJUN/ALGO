name: Update Algorithm Grass

on:
  # 기존 일괄 PR 병합 Workflow가 끝난 뒤 실행
  workflow_run:
    workflows:
      - "Batch merge all PRs"
    types:
      - completed

  # 필요할 때 Actions 화면에서 직접 실행 가능
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-algorithm-grass
  cancel-in-progress: false

jobs:
  update-grass:
    # Batch merge가 성공했거나,
    # 직접 실행한 경우에만 동작
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate algorithm grass
        run: |
          python .github/scripts/update_grass.py

      - name: Commit grass
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/algorithm-grass.svg)" ]; then
            echo "잔디 변경 사항이 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add assets/algorithm-grass.svg

          git commit -m "docs: 알고리즘 잔디 업데이트"

          git push origin HEAD:main
