name: Update Problem Duty

on:
  schedule:
    # 월~금 오후 18:00 KST
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Seoul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-problem-duty
  cancel-in-progress: false

jobs:
  update-duty:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate problem duty SVG
        run: |
          python .github/scripts/update_duty.py

      - name: Commit duty SVG
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/problem-duty.svg)" ]; then
            echo "담당자 SVG 변경 사항이 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 현재 .gitignore에서 assets가 제외되어 있어도
          # 새 SVG를 추가할 수 있도록 -f 사용
          git add -f -- assets/problem-duty.svg

          if git diff --cached --quiet; then
            echo "커밋할 변경 사항이 없습니다."
            exit 0
          fi

          git commit -m "chore: 문제 출제 담당자 SVG 업데이트 [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
