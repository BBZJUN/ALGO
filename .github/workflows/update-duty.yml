name: Update Problem Duty

on:
  schedule:
    # 월~금 오후 18:00 KST
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Seoul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-problem-duty
  cancel-in-progress: false

jobs:
  update-duty:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update problem duty
        run: |
          python .github/scripts/update_duty.py

      - name: Commit duty state and SVG
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- problem-duty.json problem-duty.svg)" ]; then
            echo "담당자 변경 사항이 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- problem-duty.json
          git add -- problem-duty.svg

          git commit -m "chore: 문제 출제 담당자 업데이트 [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
