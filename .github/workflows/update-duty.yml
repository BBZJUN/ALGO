name: Update Problem Duty

on:
  schedule:
    # 평일 오전 00:05 KST
    - cron: "5 0 * * 1-5"
      timezone: "Asia/Seoul"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-problem-duty
  cancel-in-progress: false

jobs:
  update-duty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update problem duty
        run: |
          python .github/scripts/update_duty.py

      - name: Commit duty
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- README.md .github/problem-duty.json)" ]; then
            echo "담당자 변경 사항이 없습니다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add .github/problem-duty.json

          git commit -m "docs: 문제 출제 담당자 업데이트"

          git push origin HEAD:main
